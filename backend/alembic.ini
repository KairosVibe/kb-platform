# Alembic configuration (2026-09-16, M1-6)
#
# !!! ASCII ONLY - DO NOT ADD NON-ASCII COMMENTS TO THIS FILE !!!
#
# Reason (measured, not assumed): Alembic reads this file through
# configparser with encoding="locale". On a Chinese Windows the locale
# encoding is GBK, so a UTF-8 Chinese comment raises
#   UnicodeDecodeError: 'gbk' codec can't decode byte 0x.. in position ..
# and every alembic command fails before doing anything.
# Python source files (alembic/env.py) are read as UTF-8, so Chinese
# comments are fine there - this restriction applies only to *.ini read
# by configparser. See WORKLOG for the full failure/solution note.
#
# Basis: DATA-CONTRACTS.md section 5 (DDL is generated from SQLAlchemy
# MetaData via Alembic, target MySQL 8.0.26). Hand-written production DDL
# is forbidden, and metadata.create_all() must not replace migrations.

[alembic]
script_location = alembic

# Let alembic import app.* (aligned with pytest.ini: pythonpath = .)
prepend_sys_path = .

# Revision file name: numeric prefix keeps files in review order
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# sqlalchemy.url is intentionally EMPTY: the DSN is resolved by
# alembic/env.py from app.core.config.
#   - the DSN contains a password; committing it into a versioned .ini is
#     forbidden (DEPLOYMENT section 2 item 4: secrets are injected at
#     runtime and must not enter git/logs).
#   - temporary override:
#       alembic -x db_url="mysql+aiomysql://..." upgrade head
sqlalchemy.url =

[post_write_hooks]
# No formatting hook: migrations are security-relevant and are reviewed by
# a human; no automatic rewriting of generated DDL.

# ---------------------------------------------------------------- logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
