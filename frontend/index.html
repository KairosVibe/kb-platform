<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识库管理平台</title>
    <script>
      // 首屏防暗色闪白（FRONTEND-SPEC §7.6）：仅读取主题偏好，不涉及任何身份信息。
      try {
        if (localStorage.getItem('kb.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* 隐私模式下 localStorage 不可用，忽略即可 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
